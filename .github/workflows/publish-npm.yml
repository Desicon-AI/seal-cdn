name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package to npm
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-package-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Build publishable package
        run: |
          mkdir -p "$RUNNER_TEMP/seal-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/seal-package"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/seal-package/*.tgz
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11
      - run: npm publish dist/*.tgz --access public --ignore-scripts
